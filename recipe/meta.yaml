{% set name = "duf" %}
{% set version = "0.9.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/muesli/duf/archive/v{{ version }}.tar.gz
  sha256: a81883475ab5591840882892a85185b7cda153e87f4d3978b45dec215761585c

build:
  number: 0

requirements:
  build:
    - {{ compiler('go-nocgo') }}
    - go-licenses

test:
  commands:
    - duf --help

about:
  home: https://github.com/muesli/duf
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Disk Usage/Free Utility - a better 'df' alternative
  dev_url: https://github.com/muesli/duf

extra:
  recipe-maintainers:
    - danielnachun
